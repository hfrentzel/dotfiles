line-length = 80
preview = true

[lint]
select = [
    # pycodestyle and Pyflakes
    "W", "E", "F", 
    #pep-8-naming
    "N",
    # isort
    "I", 
    # McCabe
    "C", 
    # Pylint
    "PLC", "PLE", "PLR", "PLW"]

ignore = [
    "PLW1510", # subprocess-run-without-check
    "PLW1514", # unspecified-encoding
]

[lint.mccabe]
max-complexity = 15
